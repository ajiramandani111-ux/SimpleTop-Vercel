name: Neon Database Migration

on:
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - ".github/workflows/neon-migrate.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e

          echo "Checking database connection..."
          psql "$DATABASE_URL" -c "SELECT version();"

          echo "Checking migration table..."
          psql "$DATABASE_URL" -c "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              id VARCHAR(255) PRIMARY KEY,
              applied_at TIMESTAMP NOT NULL DEFAULT NOW()
            );
          "

          for file in sql/*.sql; do
            name=$(basename "$file")

            if [ "$name" = "01_laptop_bestseller.sql" ] || [ "$name" = "02_users_sessions.sql" ]; then
              echo "Skipping already-applied migration: $name"
              continue
            fi

            applied=$(psql "$DATABASE_URL" -tAc \
              "SELECT COUNT(*) FROM schema_migrations WHERE id = '$name';")

            if [ "$applied" = "0" ]; then
              echo "Running migration: $name"

              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"

              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                "INSERT INTO schema_migrations (id) VALUES ('$name');"

              echo "Migration completed: $name"
            else
              echo "Migration already applied: $name"
            fi
          done
